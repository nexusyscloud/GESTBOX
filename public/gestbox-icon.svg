<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo circular -->
  <circle cx="16" cy="16" r="15" fill="url(#grad1)" stroke="#0e7490" stroke-width="2"/>
  
  <!-- Icono de herramienta/engranaje -->
  <g transform="translate(16,16)">
    <!-- Llave inglesa -->
    <path d="M-6,-8 L-4,-8 L-4,-2 L2,-2 L2,0 L4,0 L4,2 L2,2 L2,4 L0,4 L0,2 L-2,2 L-2,8 L-4,8 L-4,2 L-6,2 Z" 
          fill="white" stroke="#0e7490" stroke-width="0.5"/>
    
    <!-- Engranaje pequeño -->
    <circle cx="4" cy="-4" r="2.5" fill="white" stroke="#0e7490" stroke-width="0.5"/>
    <circle cx="4" cy="-4" r="1" fill="#0891b2"/>
    
    <!-- Detalles adicionales -->
    <rect x="-1" y="-1" width="2" height="2" fill="#0891b2" rx="0.5"/>
  </g>
  
  <!-- Texto GESTBOX (opcional, muy pequeño) -->
  <text x="16" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="3" font-weight="bold" fill="white">GB</text>
</svg>